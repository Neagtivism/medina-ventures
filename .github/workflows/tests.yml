name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile check
        run: |
          python3 -m py_compile projects/exodus/src/*.py projects/exodus/leadgen/*.py projects/talisman/src/*.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
